<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:with="isStudent=${type.name()=='Student'}">
<head>
    <title th:text="${pageTitle}">Titolo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/static/css/tailwind.css}">
    <link rel="stylesheet"  th:if="${isStudent}" th:href="@{/static/css/student.css}" />
    <link rel="stylesheet"  th:unless="${isStudent}" th:href="@{/static/css/teacher.css}" />
</head>
    <body class="relative min-h-screen">

        <div th:replace="fragments/generalFragments :: navbar"></div>

        <main class="grow flex-col items-center text-center px-4 py-8 w-full">
            <header>
                <h1 th:text="${pageTitle}" class="px-6 py-3 text-center font-semibold text-gray-700 uppercase tracking-wider">Titolo</h1>
            </header>

            <div id="fragment-container" th:insert="@{'fragments/'+${fragkind}} :: ${fragname}"></div>
        </main>

        <div th:replace="fragments/generalFragments :: footer"></div>

    </body>

    <script th:src="@{/static/js/spa.js}"></script>
</html>
