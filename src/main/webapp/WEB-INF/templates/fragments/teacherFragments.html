
<!-- enrolledstudents-->
<div  th:fragment="enrolledstudents">
  <h1 class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Studenti iscritti all'appello</h1> <!--TODO: Aggiungere nome corso e data appello-->
    <h1 th:if="${emptyReport}" class="px-6 py-3 text-center text-base font-semibold text-red-700 uppercase tracking-wider">Nessun voto da verbalizzare</h1>
    <div class="overflow-x-auto rounded-lg shadow-md">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-100">
      <tr>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="matricola" class="inline-flex items-center space-x-1">
            Matricola
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="cognome" class="inline-flex items-center space-x-1">
            Cognome e nome
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="email" class="inline-flex items-center space-x-1">
            Email
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="corsoLaurea" class="inline-flex items-center space-x-1">
            Corso di laurea
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="voto" class="inline-flex items-center space-x-1">
            Voto
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="statoValutazione" class="inline-flex items-center space-x-1">
            Stato valutazione
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
          <a data-sortby="idVerbale" class="inline-flex items-center space-x-1">
            Verbale
          </a>
        </th>
        <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Modifica</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 bg-white">
      <tr th:each="enrollment : ${enrollments}">
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.student().id()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="|${enrollment.student().surname()} ${enrollment.student().name()}|"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.student().email()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.student().degreeCourse()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.grade()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.gradingStatus().toString()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900"  th:text="${enrollment.verbalID()}"></td>
        <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" ><a th:if="${enrollment.gradingStatus().name() == 'NotInserted' or enrollment.gradingStatus().name() == 'Inserted'}" th:href="|@{grade-student}?student=${enrollment.student().id()}&course=${enrollment.courseID()}&session=${enrollment.examSessionID()}|"><img class="s" style="width: 1em; height: 1em;" th:src="@{static/svg/pencil-square.svg}" alt="Modifica"/></a></td>
      </tr>
      </tbody>
    </table>
        <script th:src="@{/static/js/tableSort.js}"></script>
  </div>

  <div class="mt-6 flex justify-center space-x-4">
    <a class="inline-block bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 text-white font-medium rounded-md text-sm px-4 py-2 transition" th:href="@{publish-grades(course=${param.course}, session=${param.session}, sort=${param.sort}, order=${param.order})}">Pubblica</a>
    <a class="inline-block bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 text-white font-medium rounded-md text-sm px-4 py-2 transition" th:href="@{generateReport(session=${param.session},course=${param.course})}">Verbalizza</a>
  </div>
</div>


<!-- gradestudent-->
<div class="overflow-x-auto rounded-lg shadow-md" th:fragment="gradestudent">
  <form class="w-full max-w-md mx-auto p-6 space-y-6" action="grade-student" method="post">
    <label class="block text-sm font-medium text-gray-700" for="studentNumber">Matricola</label>
    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="studentNumber" th:value="${enrollment.student().id()}" disabled/>

    <label class="block text-sm font-medium text-gray-700" for="studentFullName">Cognome e nome</label>
    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="studentFullName" th:value="|${enrollment.student().name()} ${enrollment.student().surname()}|" disabled/>

    <label class="block text-sm font-medium text-gray-700" for="studentEmail">Email</label>
    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="studentEmail" th:value="${enrollment.student().email()}" disabled/>

    <label class="block text-sm font-medium text-gray-700" for="degreeCourse">Corso di laurea</label>
    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="degreeCourse" th:value="${enrollment.student().degreeCourse()}" disabled/>

    <label class="block text-sm font-medium text-gray-700" for="grade">Voto</label>
    <select class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" name="grade" id="grade">
      <option th:each="grade : ${grades}" th:value="${grade}" th:text="${grade}" name="grade"></option>
    </select>

    <label class="block text-sm font-medium text-gray-700" for="gradingStatus">Stato valutazione</label>
    <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="gradingStatus" th:value="${enrollment.gradingStatus().toString()}" disabled/>

    <input class="w-full bg-purple-700 text-white font-medium py-2 px-4 rounded-md hover:bg-purple-800 transition" type="submit" value="Valuta studente"/>
  </form>
</div>

<!-- reportList -->
<div class="overflow-x-auto rounded-lg shadow-md mt-6" th:fragment="reportList">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
        <tr>
            <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Id verbale</th>
            <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Data verbale</th>
            <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider" >Corso</th>
            <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Data appello</th>
            <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Azione</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
        <tr th:each="report : ${reports}">
            <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.id()}"></td>
            <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.reportDate()} "></td>
            <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.courseName()}"></td>
            <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.examDate()}"></td>
            <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" >
                <a th:href="@{report(reportId=${report.id()},sessionId=${report.sessionId()})}" class="inline-block bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 text-white font-medium rounded-md text-sm px-4 py-2 transition">Apri</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- report -->
<div th:fragment="report">
    <div class="overflow-x-auto rounded-lg shadow-md mt-6" >
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Id verbale</th>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Data verbale</th>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider" >Corso</th>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">Data appello</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
            <tr>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.id()}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.reportDate()} "></td>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.courseName()}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${report.examDate()}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-6 overflow-x-auto rounded-lg shadow-md">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-100">
            <tr>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
                    Matricola
                </th>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
                    Cognome e Nome
                </th>
                <th class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider">
                     Voto
                </th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-200 bg-white">
            <tr th:each="enrollment : ${enrollments}">
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.student().id()}"></td>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="|${enrollment.student().surname()} ${enrollment.student().name()}|"></td>
                <td class="px-6 py-4 whitespace-nowrap text-base text-gray-900" th:text="${enrollment.grade()}"></td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
