
<!-- examresult-->
<div class="overflow-x-auto rounded-lg shadow-md" th:fragment="examresult">

    <!-- tutta form thif lo stato è pubblicato o rifiutato-->
    <h1 class="px-6 py-3 text-center text-base font-semibold text-gray-700 uppercase tracking-wider" th:if="${enrollment.gradingStatus().toString() == 'Non inserito' || enrollment.gradingStatus().toString() == 'Inserito' }"> Voto non ancora definito </h1>
    <h1 class="px-6 py-3 text-center text-base font-semibold text-red-500 uppercase tracking-wider" th:if="${enrollment.gradingStatus().toString() == 'Rifiutato' }"> Voto rifiutato </h1>

    <form th:unless="${enrollment.gradingStatus().toString() == 'Non inserito' || enrollment.gradingStatus().toString() == 'Inserito' }" class="w-full max-w-md mx-auto p-6 space-y-6" action="RejectResult" method="post">


        <!-- passo parametri-->
        <input type="hidden" name="course" th:value="${enrollment.courseID()}" />
        <input type="hidden" name="session" th:value="${enrollment.examSessionID()}" />

        <!--campi effettivi form-->
        <label class="block text-sm font-medium text-gray-700" for="studentNumber">Matricola</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="studentNumber" th:value="${enrollment.student().id()}" disabled/>

        <label class="block text-sm font-medium text-gray-700" for="studentFullName">Cognome e nome</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="studentFullName" th:value="|${enrollment.student().name()} ${enrollment.student().surname()}|" disabled/>

        <label class="block text-sm font-medium text-gray-700" for="coursename">Corso</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="coursename" th:value="${course.name()}" disabled/>

        <label class="block text-sm font-medium text-gray-700" for="sessiondate">Data</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500"  type="text" id="sessiondate" th:value="${dateTime}" disabled/>

        <label class="block text-sm font-medium text-gray-700" for="grade">Voto</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="grade" th:value="${enrollment.grade()}" disabled/>

        <label class="block text-sm font-medium text-gray-700" for="gradingStatus">Stato valutazione</label>
        <input class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-sm text-center bg-white disabled:bg-gray-100 disabled:text-gray-500" type="text" id="gradingStatus" th:value="${enrollment.gradingStatus().toString()}" disabled/>

        <!-- thiif se non già rifiutato e se range voto -->
        <input th:if="${enrollment.gradingStatus().toString() == 'Pubblicato' && enrollment.grade != 'Vuoto' && enrollment.grade != 'Assente' && enrollment.grade != 'Rimandato' && enrollment.grade != 'Riprovato' }" class="w-full bg-red-600 text-white font-medium py-2 px-4 rounded-md hover:bg-red-700 transition" type="submit" value="Rifiuta"/>
    </form>
</div>
