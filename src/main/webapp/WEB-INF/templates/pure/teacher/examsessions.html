<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <title>Appelli d'esame</title>
      <link rel="stylesheet" th:href="@{/static/css/common.css}">
      <link rel="stylesheet" th:href="@{/static/css/teacher.css}">
  </head>
  <body>
    <h1 class="fs-xl fw-l">Appelli d'esame del corso</h1> <!--TODO: Aggiungere nome corso-->
    <table class="m-w xs-h fs-xl">
      <thead class="fw-m">
      <tr>
        <th>Date</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="course : ${courses}">
        <td><a th:href="(${isStudent} ? '' : @{'/enrolled-students'}) + '?course=' + ${course.getID()}"  th:text=" '[' + ${course.getID()} + '] ' + ${course.getName()}"></a></td>
      </tr>
      </tbody>
    </table>
  </body>
</html>
