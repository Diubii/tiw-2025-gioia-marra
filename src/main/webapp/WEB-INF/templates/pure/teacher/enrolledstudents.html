<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Studenti iscritti</title>
      <link rel="stylesheet" th:href="@{/static/css/common.css}">
      <link rel="stylesheet" th:href="@{/static/css/teacher.css}">
  </head>
  <body>
    <h1 class="fs-xl fw-l">Studenti iscritti al corso</h1> <!--TODO: Aggiungere nome corso-->
    <p th:text="${GradingStatus.NotInserted}">Non trovato</p>
    <table>
      <thead class="fs-xl">
        <tr>
            <th>Matricola</th>
            <th>Cognome e nome</th>
            <th>Email</th>
            <th>Corso di laurea</th>
            <th>Voto</th>
            <th>Stato valutazione</th>
            <th>Verbale</th>
            <th>Modifica</th>
        </tr>
      </thead>
      <tbody>
          <tr th:each="enrollment : ${enrollments}">
              <td th:text="${enrollment.student().id()}"></td>
              <td th:text="|${enrollment.student().name()} ${enrollment.student().surname()}|"></td>
              <td th:text="${enrollment.student().email()}"></td>
              <td th:text="${enrollment.student().degreeCourse()}"></td>
              <td th:text="${enrollment.grade()}"></td>
              <td th:text="${enrollment.gradingStatus().toString()}"></td>
              <td th:text="${enrollment.verbalID()}"></td>
              <td><a th:if="${enrollment.gradingStatus() == GradingStatus.NotInserted or enrollment.gradingStatus() == GradingStatus.Inserted}" th:href="|@{grade-student}?student=${enrollment.student().id()}&course=${enrollment.courseID()}&session=${enrollment.examSessionID()}|"><img class="s" th:src="@{static/svg/pencil-square.svg}" alt="Modifica"/></a></td>
          </tr>
      </tbody>
    </table>
    <div class="flex full-w fs-xl">
        <a class="trans button" th:href="@{publish-grades}">Pubblica</a>
        <a class="trans button" th:href="@{verbalize-grades}">Verbalizza</a>
    </div>
  </body>
</html>
