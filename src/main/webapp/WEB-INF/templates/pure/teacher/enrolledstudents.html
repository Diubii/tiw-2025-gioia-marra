<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Studenti iscritti</title>
      <link rel="stylesheet" th:href="@{/static/css/common.css}">
      <link rel="stylesheet" th:href="@{/static/css/teacher.css}">
  </head>
  <body>
    <h1 class="fs-xl fw-l">Studenti iscritti all'appello</h1> <!--TODO: Aggiungere nome corso e data appello-->
    <table>
      <thead class="fs-xl">
        <tr>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='matricola', order=${( param.sort[0]== 'matricola' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Matricola
                    <span th:if="${param.sort[0] == 'matricola'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='cognome', order=${( param.sort[0]== 'cognome' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Cognome e nome
                    <span th:if="${param.sort[0] == 'cognome'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='email', order=${( param.sort[0]== 'email' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Email
                    <span th:if="${param.sort[0] == 'email'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='corsoLaurea', order=${( param.sort[0]== 'corsoLaurea' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Corso di laurea
                    <span th:if="${param.sort[0] == 'corsoLaurea'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='voto', order=${( param.sort[0]== 'voto' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Voto
                    <span th:if="${param.sort[0] == 'voto'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='statoValutazione', order=${( param.sort[0]== 'statoValutazione' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Stato valutazione
                    <span th:if="${param.sort[0] == 'statoValutazione'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>
                <a th:href="@{/enrolled-students(course=${param.course}, session=${param.session}, sort='idVerbale', order=${( param.sort[0]== 'idVerbale' && param.order[0] == 'asc') ? 'desc' : 'asc'})}">
                    Verbale
                    <span th:if="${param.sort[0] == 'idVerbale'}" th:text="${param.order[0] == 'desc' ? '↑' : '↓'}"></span>
                </a>
            </th>
            <th>Modifica</th>
        </tr>
      </thead>
      <tbody>
          <tr th:each="enrollment : ${enrollments}">
              <td th:text="${enrollment.student().id()}"></td>
              <td th:text="|${enrollment.student().surname()} ${enrollment.student().name()}|"></td>
              <td th:text="${enrollment.student().email()}"></td>
              <td th:text="${enrollment.student().degreeCourse()}"></td>
              <td th:text="${enrollment.grade()}"></td>
              <td th:text="${enrollment.gradingStatus().toString()}"></td>
              <td th:text="${enrollment.verbalID()}"></td>
              <td><a th:if="${enrollment.gradingStatus().name() == 'NotInserted' or enrollment.gradingStatus().name() == 'Inserted'}" th:href="|@{grade-student}?student=${enrollment.student().id()}&course=${enrollment.courseID()}&session=${enrollment.examSessionID()}|"><img class="s" th:src="@{static/svg/pencil-square.svg}" alt="Modifica"/></a></td>
          </tr>
      </tbody>
    </table>
    <div class="flex full-w fs-xl">
        <a class="trans button" th:href="@{publish-grades(course=${param.course}, session=${param.session}, sort=${param.sort}, order=${param.order})}">Pubblica</a>
        <a class="trans button" th:href="@{verbalize-grades}">Verbalizza</a>
    </div>
  </body>
</html>
