<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
  <head>
      <meta charset="UTF-8">
      <title>Studenti iscritti</title>
      <link rel="stylesheet" th:href="@{/static/css/common.css}">
      <link rel="stylesheet" th:href="@{/static/css/teacher.css}">
  </head>
  <body>
    <h1 class="fs-xl fw-l">Studenti iscritti al corso</h1> <!--TODO: Aggiungere nome corso-->
    <table>
      <thead class="fs-xl">
        <tr>
            <th>Matricola</th>
            <th>Cognome e nome</th>
            <th>Email</th>
            <th>Corso di laurea</th>
            <th>Voto</th>
            <th>Stato valutazione</th>
            <th>Verbale</th>
            <th>Modifica</th>
        </tr>
      </thead>
      <tbody>
          <tr th:each="enrollment : ${enrollments}">
              <td th:text="${enrollment.getStudentNumber()}"></td>
              <td th:text="${enrollment.getStudentFullName()}"></td>
              <td th:text="${enrollment.getStudentEmail()}"></td>
              <td th:text="${enrollment.getDegreeCourse()}"></td>
              <td th:text="${enrollment.getGrade()}"></td>
              <td th:text="${enrollment.getGradingStatus().toString()}"></td>
              <td th:text="${enrollment.getVerbalID()}"></td>
              <td><a th:href="@{grade-student} + '?student=' + ${enrollment.getStudentNumber()} + '&exam=' + ${enrollment.getExamSession()}"><img class="xxxxs-h" th:src="@{static/svg/pencil-square.svg}" alt="Modifica"/></a></td>
          </tr>
      </tbody>
    </table>
  </body>
</html>
