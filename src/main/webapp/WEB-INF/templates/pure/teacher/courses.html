<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <title>Corsi docente</title>
    <link rel="stylesheet" th:href="@{/static/css/common.css}" />
    <link rel="stylesheet" th:href="@{/static/css/teacher.css}" />
</head>
<body>
    <table class="m-w xs-h fs-xl">
        <thead class="fw-m">
            <tr>
                <th>I corsi che insegni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td><a th:text=" '[' + ${course.getId()} + '] ' + ${course.getName()}"></a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
