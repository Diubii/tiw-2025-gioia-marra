<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <title>Corsi studente</title>
    <link rel="stylesheet" th:href="@{/static/css/common.css}" />
    <link rel="stylesheet" th:href="@{/static/css/student.css}" />
</head>
<body>
<table class="m-w xs-h fs-xl">
    <thead class="fw-m">
    <tr>
        <th>I corsi che stai frequentando</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="course : ${courses}">
        <td><a th:text=" '[' + ${course.getId()} + '] ' + ${course.getName()}"></a></td>
    </tr>
    </tbody>
</table>
</body>
</html>
