<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risultato esame</title>
    <link rel="stylesheet" th:href="@{static/css/common.css}" />
    <link rel="stylesheet" th:href="@{static/css/student.css}" />
</head>

<body>

        <!-- tutta form thif lo stato è pubblicato o rifiutato-->
        <div th:if="${enrollment.gradingStatus().toString() == 'Non inserito' || enrollment.gradingStatus().toString() == 'Inserito' }"> Voto non ancora definito </div>
        <div th:if="${enrollment.gradingStatus().toString() == 'Rifiutato' }"> Il voto è stato rifiutato </div>

        <form th:unless="${enrollment.gradingStatus().toString() == 'Non inserito' || enrollment.gradingStatus().toString() == 'Inserito' }" class="s-w fs-xl" action="RejectResult" method="post">


            <!-- passo parametri-->
            <input type="hidden" name="course" th:value="${course.id()}" />
            <input type="hidden" name="sessionID" th:value="${enrollment.examSessionID()}" />

            <!--campi effettivi form-->
            <label for="studentNumber">Matricola</label>
            <input type="text" id="studentNumber" th:value="${enrollment.student().id()}" disabled/>

            <label for="studentFullName">Cognome e nome</label>
            <input type="text" id="studentFullName" th:value="|${enrollment.student().name()} ${enrollment.student().surname()}|" disabled/>

            <label for="coursename">Corso</label>
            <input type="text" id="coursename" th:value="${course.name}" disabled/>

            <label for="sessiondate">Data</label>
            <input type="text" id="sessiondate" th:value="${examsession.dateTime()}" disabled/>

            <label for="grade">Voto</label>
            <input type="text" id="grade" th:value="${enrollment.grade()}" disabled/>

            <label for="gradingStatus">Stato valutazione</label>
            <input type="text" id="gradingStatus" th:value="${enrollment.gradingStatus().toString()}" disabled/>

            <!-- thiif se non già rifiutato e se range voto -->
            <input th:if="${enrollment.gradingStatus().toString() == 'Pubblicato' && enrollment.grade != 'Vuoto' && enrollment.grade != 'Assente' && enrollment.grade != 'Fallito' && enrollment.grade != 'Riprovato' }" class="btn-cancel trans" type="submit" value="Rifiuta"/>
        </form>



</body>
</html>
